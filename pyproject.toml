[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "document-intelligence-bench"
version = "0.1.0"
description = "Evidence-first benchmark for document intelligence models and pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "AI Native World"}]
dependencies = [
  "jsonschema>=4.25,<5",
  "PyYAML>=6,<7",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
docbench = "docbench.cli:main"

[tool.setuptools.package-data]
docbench = ["benchmark-suite.schema.json", "macos_vision_ocr.swift"]
